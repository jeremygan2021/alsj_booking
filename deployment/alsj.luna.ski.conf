server {
    listen 80;
    server_name alsj.luna.ski;
    location /.well-known/acme-challenge/ {
        root /var/www/alsj-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name alsj.luna.ski;
    ssl_certificate /etc/letsencrypt/live/alsj.luna.ski/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alsj.luna.ski/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3206;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    access_log /var/log/nginx/alsj.luna.ski.access.log;
    error_log /var/log/nginx/alsj.luna.ski.error.log;
}
